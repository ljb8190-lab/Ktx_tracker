name: KTX Seat Tracker

on:
  schedule:
    # UTC 기준 (한국 시간 = UTC + 9시간)
    # 아래 설정은 30분마다 자동으로 실행하여 취소표 감시
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install requests korail2

      - name: KTX 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KORAIL_ID: ${{ secrets.KORAIL_ID }}
          KORAIL_PW: ${{ secrets.KORAIL_PW }}
        run: python main.py
